# Indispensable pour que les tests puissent lire le fichier .env à la racine
spring.config.import=optional:file:.env[.properties]

# --- 1. CONFIGURATION DE LA BDD (H2 In-Memory) ---
# url : mode mémoire ("mem").
# DB_CLOSE_DELAY=-1 : Empêche la BDD de se fermer entre deux transactions de test.
# DB_CLOSE_ON_EXIT=FALSE : Garde la BDD active tant que la JVM tourne.
spring.datasource.url=${DB_URL_TEST}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- 2. CONFIGURATION HIBERNATE / JPA ---
# create-drop : Supprime tout et recrée les tables à chaque lancement de la suite de tests.
# C'est ce qui garantit que nos tests partent d'une base propre.
spring.jpa.hibernate.ddl-auto=create-drop

# Forcer le dialecte H2 pour être sûr que le SQL généré soit compatible
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- 3. LOGS & DEBUG ---
# Affiche les requêtes SQL dans la console
spring.jpa.show-sql=true
# Formate le SQL sur plusieurs lignes (plus lisible)
spring.jpa.properties.hibernate.format_sql=true
# Affiche les valeurs des paramètres (?, ?) dans les logs (trace)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- 4. CONSOLE H2 ---
# Permet d'accéder à l'interface graphique si vous mettez un point d'arrêt (debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- 5. CONFIGURATION JWT (Bouchon pour les tests) ---
# Valeur bidon nécessaire pour que le JwtService puisse démarrer sans planter

security.jwt.secret=${JWT_SECRET_TEST}
security.jwt.expiration-seconds=${JWT_EXPIRATION}
